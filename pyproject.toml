[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "germanetpy"
version = "0.3.0"
description = "Python API for GermaNet"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }

authors = [
    { name = "Ben Campbell", email = "ben.campbell@uni-tuebingen.de" }
]

dependencies = [
    "numpy>=1.18.1",
    "lxml>=4.4.2",
    "fastenum>=0.0.1",
    "tqdm>=4.14",
    "python-Levenshtein==0.25.1",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Germanet-sfs/germanetpy"
Repository = "https://github.com/Germanet-sfs/germanetpy"

[project.optional-dependencies]
dev = ["pytest>=5.3.2"]

[tool.setuptools.packages.find]
include = ["germanetpy*"]